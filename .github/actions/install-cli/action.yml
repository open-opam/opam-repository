# The one place the registry names its validator. A submission can never choose
# its own gate: moving to a newer release is a maintainer's pull request.
name: Install the CLI
description: Installs the exact open-opam release the registry runs
runs:
  using: composite
  steps:
    - shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        VERSION: "0.2.0"
        SHA256: "88c78f14dc584b9f61de04187206fc8e220ba1156dec8ad2621ceeba11e88da5"
      run: |
        gh release download "$VERSION" -R open-opam/open-opam-cli -p open-opam-linux-x86_64 -D "$RUNNER_TEMP"
        echo "$SHA256  $RUNNER_TEMP/open-opam-linux-x86_64" | sha256sum -c -
        chmod +x "$RUNNER_TEMP/open-opam-linux-x86_64"
        mkdir -p "$RUNNER_TEMP/bin"
        mv "$RUNNER_TEMP/open-opam-linux-x86_64" "$RUNNER_TEMP/bin/open-opam"
        echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
