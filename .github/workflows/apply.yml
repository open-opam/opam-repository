# Makes each opam file match its records. A pull request only adds records, so
# an author's fork never carries this edit; the registry makes it, in a pull
# request of its own, validated and merged like any. The registry's App opens
# it, since a pull request opened with the workflow's token starts no check.
# It runs on every push to main and starts again from main each time, so a
# record that merged while the last edit waited is in the next one; and once a
# day, after the download count, should a run after a merge have failed.
name: Make opam files match their records

on:
  push:
    branches: [main]
  workflow_run:
    workflows: [Count downloads]
    types: [completed]

permissions: {}

concurrency:
  group: apply

jobs:
  apply:
    runs-on: ubuntu-24.04
    environment: registry
    env:
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/create-github-app-token@v3
        id: app
        with:
          client-id: ${{ vars.REGISTRY_APP_CLIENT_ID }}
          private-key: ${{ secrets.REGISTRY_APP_PRIVATE_KEY }}
      - uses: actions/checkout@v5
        with:
          ref: main
          # A restoration reads the bytes a version was published with from history.
          fetch-depth: 0
          token: ${{ steps.app.outputs.token }}
      - name: Make each opam file match its records
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          APP: ${{ steps.app.outputs.app-slug }}
        run: |
          .github/scripts/apply-records.sh
          if git diff --quiet; then exit 0; fi
          title="Apply $(git diff --name-only | cut -d/ -f3 | paste -sd' ' -)"
          git config user.name "$APP[bot]"
          git config user.email "$APP[bot]@users.noreply.github.com"
          git switch -c apply
          git commit -qam "$title"
          git push -q --force origin apply
          if [ -z "$(gh pr list -R "$REPO" --head apply --state open --json number --jq '.[].number')" ]; then
            gh pr create -R "$REPO" --base main --head apply --title "$title" --body "Makes the opam files match their records."
          fi
