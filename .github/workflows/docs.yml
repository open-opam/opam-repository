# The catalogue on GitHub Pages, rebuilt on every push to main, so a merged
# publication or revocation shows there, and after each download snapshot. It
# reads opam files, records and snapshots, and asks GitHub for each release's
# date and downloads; every branch is fetched, for the stats branch.
#
# Its islands are OCaml, built with solidtype installed from this registry, so
# the build runs a package's code: it has only a read token, and the token
# that publishes Pages is in a job of its own that runs nothing but the
# deployment.
name: docs

on:
  push:
    branches: [main]
  # A snapshot is pushed with the workflow's own token, which starts no
  # workflow, so the catalogue follows the stats run instead.
  workflow_run:
    workflows: [stats]
    types: [completed]
  # Auto-merge merges with the workflow's token too, so a publication merged by
  # itself starts nothing either; this catches up, building only when main has
  # moved past what the catalogue was last built from.
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  behind:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      deployments: read
    outputs:
      behind: ${{ steps.compare.outputs.behind }}
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - id: compare
        run: |
          main=$(gh api "repos/$REPO/commits/main" --jq .sha)
          built=$(gh api "repos/$REPO/deployments?environment=github-pages&per_page=1" --jq '.[0].sha // ""')
          if [ "$main" = "$built" ]; then echo "behind=false"; else echo "behind=true"; fi >> "$GITHUB_OUTPUT"

  build:
    needs: behind
    if: github.event_name != 'schedule' || needs.behind.outputs.behind == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      # opam comes from Ubuntu, as validate.yml takes it, and nothing is
      # restored from a cache, which a job running package code could have
      # written.
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq opam
      - run: opam init --bare --disable-sandboxing --no-setup -y
      - uses: oven-sh/setup-bun@v2
      - run: make setup
      - run: make docs
        # Each package's README and each repository's releases, asked of
        # GitHub's API: with the token, past its limit for a runner's shared
        # address.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _build/docs

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - uses: actions/deploy-pages@v5
        id: deployment
