# The maintainer's revocation, for security, legal or a gone release; an author
# revokes their own with open-opam revoke. Only someone who can write to this
# repository can start a workflow; that is the authorisation, and the record says
# who it was. Like an author's, it only adds records, and apply makes the opam
# files match once it merges.
name: Revoke a release
run-name: "Revoke ${{ inputs.name }} ${{ inputs.version || 'every version' }} (${{ inputs.reason }})"

on:
  workflow_dispatch:
    inputs:
      name:
        description: The package
        required: true
      version:
        description: The version, or empty for every version
        required: false
      reason:
        description: Why
        required: true
        type: choice
        options: [security, legal, upstream-gone]
      evidence:
        description: A link to what shows why
        required: true

permissions: {}

jobs:
  revoke:
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      NAME: ${{ inputs.name }}
      VERSION: ${{ inputs.version }}
      REASON: ${{ inputs.reason }}
      EVIDENCE: ${{ inputs.evidence }}
      ACTOR: ${{ github.actor }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - name: Add a record for each version
        run: |
          case "$NAME" in *[!A-Za-z0-9_+-]*|'') echo "Not a package name."; exit 1;; esac
          case "$VERSION" in *[!A-Za-z0-9_.+~-]*) echo "Not a version."; exit 1;; esac
          test -d "packages/$NAME"
          now=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          mkdir -p .open-opam/revocations
          for dir in packages/"$NAME"/"$NAME".${VERSION:-*}; do
            record=".open-opam/revocations/$(basename "$dir").json"
            test -f "$dir/opam"
            jq -cn --arg reason "$REASON" --arg actor "$ACTOR" --arg evidence "$EVIDENCE" --arg at "$now" \
              '{reason: $reason, actor: $actor, evidence: $evidence, revoked_at: $at}' > "$record"
          done
      - name: Open the pull request and let it merge once validated
        run: |
          branch="revoke/$GITHUB_RUN_ID"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add .open-opam/revocations
          git commit -qm "Revoke $NAME $VERSION" -m "Reason: $REASON. Evidence: $EVIDENCE"
          git push -q origin "$branch"
          url=$(gh pr create --base main --head "$branch" --title "Revoke $NAME $VERSION" --body "Reason: $REASON. Evidence: $EVIDENCE. Actor: $ACTOR.")
          gh workflow run validate.yml -R "$REPO" --ref main -f pr="${url##*/}" -f sha="$(git rev-parse HEAD)"
          gh pr merge "${url##*/}" --auto --squash -R "$REPO"
