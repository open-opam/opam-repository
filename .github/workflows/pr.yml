# GitHub can hold a first-time contributor's workflows for approval, but not one
# on pull_request_target, so this is what lets a publication be validated with no
# click. It runs with write permissions, so it never checks out the pull request,
# and nothing the pull request controls reaches a shell but its number and SHA.
# GitHub blocks pull_request_target on a public repository unless an Actions
# event policy allows it; this repository's policy does. A fork's publication is
# merged by the check once it passes; a branch of this repository is only
# checked.
name: Start a pull request's check
run-name: "Start the check of pull request #${{ github.event.pull_request.number }}"

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
      SHA: ${{ github.event.pull_request.head.sha }}
      HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
      BASE_REF: ${{ github.event.pull_request.base.ref }}
    steps:
      - name: Validate a publication, or a branch of this repository
        run: |
          if [ "$BASE_REF" != main ]; then
            echo "A pull request must target main."
            exit 0
          fi
          merge=false
          if [ "$HEAD_REPO" != "$REPO" ]; then
            gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[].filename' > files
            if grep -qvE '^(packages/[^/]+/[^/]+/opam|\.open-opam/(owners|revocations|restorations)/[^/]+\.json)$' files; then
              echo "A fork may only add a release's files, or its records, so this is not validated."
              exit 0
            fi
            merge=true
          fi
          gh workflow run validate.yml -R "$REPO" --ref main -f pr="$PR" -f sha="$SHA" -f merge="$merge"

