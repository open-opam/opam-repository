# Every gate, on one exact commit of one pull request. GitHub can hold a
# first-time contributor's workflows for approval, but not one on
# pull_request_target, so a publication is validated with no click. It is read
# from main and runs the validator main names, so a submission cannot weaken its
# own gate; the pull request's commit is fetched and read, never checked out
# where a token is. GitHub blocks pull_request_target on a public repository
# unless an Actions event policy allows it; this repository's policy does.
#
# What a pull request changes decides how it is judged, never where it comes
# from. Package code runs only in the install job, which has nothing worth
# taking, and which no other job relies on: no cache is restored and no artifact
# is read.
name: Check a pull request
run-name: "Check pull request #${{ github.event.pull_request.number }}"

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

concurrency:
  group: validate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    outputs:
      kind: ${{ steps.kind.outputs.kind }}
      versions: ${{ steps.kind.outputs.versions }}
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
      SHA: ${{ github.event.pull_request.head.sha }}
      AUTHOR: ${{ github.event.pull_request.user.login }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/install-cli
      # dune subst writes a dune project's version into the tag's files, as
      # dune-release does before archiving; it runs dune's code, not the package's.
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq opam ocaml-dune
      - id: kind
        name: Fetch the pull request's commit, and name what it changes
        run: |
          git fetch --quiet "https://github.com/$REPO" "refs/pull/$PR/head:refs/heads/change"
          test "$(git rev-parse change)" = "$SHA"
          kind=$(.github/scripts/kind.sh main change)
          versions=$(git diff --name-only --diff-filter=A main...change -- 'packages/*/*/opam' | cut -d/ -f3 | tr '\n' ' ')
          echo "kind=$kind" >> "$GITHUB_OUTPUT"
          echo "versions=$versions" >> "$GITHUB_OUTPUT"
      - name: The gates that need no package code
        if: steps.kind.outputs.kind == 'publication' || steps.kind.outputs.kind == 'record'
        run: open-opam check --checkout . --base main --head change --registry "$REPO" | tee -a "$GITHUB_STEP_SUMMARY"
        shell: bash -o pipefail -e {0}
      - name: A maintainer's revocation
        if: steps.kind.outputs.kind == 'revocation'
        env:
          APP: open-opam-registry[bot]
        run: |
          actor=$(.github/scripts/revocation-actor.sh main change "$AUTHOR" "$APP")
          permission=$(gh api "repos/$REPO/collaborators/$actor/permission" --jq .permission)
          .github/scripts/check-revocation.sh main change "$actor" "$permission"
      - name: A change to a published opam file is the one its records make
        if: steps.kind.outputs.kind == 'apply'
        run: .github/scripts/check-apply.sh main change

  install:
    needs: gates
    if: needs.gates.outputs.kind == 'publication'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      PR: ${{ github.event.pull_request.number }}
      VERSIONS: ${{ needs.gates.outputs.versions }}
      OPAMYES: "1"
      OPAMCONFIRMLEVEL: unsafe-yes
    steps:
      # The pull request merged into main as it is now, so a package installs
      # against what the registry will hold, a dependency published since its
      # branch was made among it. GitHub's own merge ref is recomputed only
      # when something asks for it, so it can name an older main.
      # All of main's history, since a merge needs the commit both share.
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Merge the pull request into main
        env:
          SHA: ${{ github.event.pull_request.head.sha }}
          REPO: ${{ github.repository }}
        run: |
          git fetch --quiet "https://github.com/$REPO" "refs/pull/$PR/head"
          test "$(git rev-parse FETCH_HEAD)" = "$SHA"
          git -c user.name=validate -c user.email=validate@localhost merge --quiet --no-edit FETCH_HEAD
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq opam
      - run: opam init --bare --disable-sandboxing -n default https://opam.ocaml.org
      - run: opam repo add --dont-select registry "file://$PWD"
      - run: opam switch create check --empty --repos=default,registry
      - name: Package code runs here
        run: opam install --switch=check $VERSIONS

  # The check main requires. GitHub makes it for this pull request's own run,
  # from the jobs' results alone.
  validate:
    needs: [gates, install]
    if: always()
    runs-on: ubuntu-24.04
    env:
      GATES: ${{ needs.gates.result }}
      INSTALL: ${{ needs.install.result }}
      KIND: ${{ needs.gates.outputs.kind }}
    steps:
      - run: |
          test "$GATES" = success
          if [ "$KIND" = publication ]; then test "$INSTALL" = success; else test "$INSTALL" = skipped; fi

  # The registry's App merges, so the merge is a push like any other and starts
  # what follows it. The App holds no exemption: GitHub refuses its merge too
  # without the check. Its key is in an environment only main's workflows reach.
  # Anything but packages and records waits for a maintainer.
  merge:
    needs: [gates, validate]
    if: needs.validate.result == 'success' && needs.gates.outputs.kind != 'other'
    runs-on: ubuntu-24.04
    environment: registry
    env:
      REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
      SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/create-github-app-token@v3
        id: app
        with:
          client-id: ${{ vars.REGISTRY_APP_CLIENT_ID }}
          private-key: ${{ secrets.REGISTRY_APP_PRIVATE_KEY }}
      - name: Merge the commit that passed, and nothing pushed since
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: gh pr merge "$PR" --squash --delete-branch --match-head-commit "$SHA" -R "$REPO"
